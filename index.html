<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loyaltydigitalqr — Give them a reason to come back</title>
    <meta name="description" content="A digital loyalty card your customers can join in seconds. No app. No POS integration. Just a simple reason to return. 30 days free trial." />
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Type system: Plus Jakarta Sans (headings), Inter (UI/body), JetBrains Mono (codes only), Caveat (hero notes).
         Variable weight ranges so every weight used in the UI is real, never browser-synthesised. -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600..700&family=Inter:wght@400..800&family=JetBrains+Mono:wght@500..600&family=Plus+Jakarta+Sans:ital,wght@0,500..800;1,700..800&display=swap" rel="stylesheet">
    
    <!-- Script to prevent theme flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('loyalty_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F7F2] dark:bg-[#090909] text-[#111318] dark:text-[#F7F3EB] antialiased selection:bg-[#3027F5] selection:text-white dark:selection:bg-[#E4C174] dark:selection:text-[#090909] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
